services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: food-planner-backend
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      RUN_SCHEDULER_IN_WEB: ${RUN_SCHEDULER_IN_WEB:-0}
      # Локальный docker-compose: демо-пользователь telegram_id=123456789 (не задавайте на проде)
      SEED_DEMO_USER: "1"
      FOOD_PLANNER_DB_PATH: /data/food_planner.db
      # Лог запросов/ответов ИИ: файл попадает на хост через bind-mount ниже
      AI_TRACE_LOG_PATH: /app/backend/ai_trace/ai_requests.log.jsonl
    ports:
      - "5001:5000"
    volumes:
      - food_planner_data:/data
      - ./backend/ai_trace:/app/backend/ai_trace
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: food-planner-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Исходники с хоста — правки в Cursor сразу в контейнере, без docker cp
    volumes:
      - ./frontend/src:/app/frontend/src
    restart: unless-stopped

volumes:
  food_planner_data:
